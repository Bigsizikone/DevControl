<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2580" viewBox="0 0 1600 2580" role="img" aria-label="СД → Telegram → СД · Решение и дата выезда"><title>СД → Telegram → СД · Решение и дата выезда</title><defs><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#17212b" stroke-width="1.3"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1600" height="2580" rx="0" fill="#fff" stroke="none"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#17212b" stroke="none"/><text x="52" y="57" text-anchor="start" font-size="18" fill="#596572" font-weight="400">DEVCONTROL / SERVICE DESK</text><text x="1548" y="57" text-anchor="end" font-size="18" fill="#596572" font-weight="400">TO-BE · 10.09.2026</text><text x="52" y="111" text-anchor="start" font-size="34" fill="#17212b" font-weight="600">СД → Telegram → СД · Решение и дата выезда</text><text x="52" y="150" text-anchor="start" font-size="20" fill="#596572" font-weight="400">Согласование заявки и выбор времени проходят с повторной проверкой в Service Desk.</text><path d="M 155.0 268 L 155.0 2338" fill="none" stroke="#9ea8b1" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="37.0" y="195" width="236" height="73" rx="4" fill="#f0f3f5" stroke="#17212b"/><text x="155.0" y="224" text-anchor="middle" font-size="21" fill="#17212b" font-weight="400">Диспетчер / исполнитель</text><path d="M 585.0 268 L 585.0 2338" fill="none" stroke="#9ea8b1" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="467.0" y="195" width="236" height="73" rx="4" fill="#f0f3f5" stroke="#17212b"/><text x="585.0" y="224" text-anchor="middle" font-size="21" fill="#17212b" font-weight="400">Service Desk</text><path d="M 1015.0 268 L 1015.0 2338" fill="none" stroke="#9ea8b1" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="897.0" y="195" width="236" height="73" rx="4" fill="#f0f3f5" stroke="#17212b"/><text x="1015.0" y="224" text-anchor="middle" font-size="21" fill="#17212b" font-weight="400">Telegram-бот</text><path d="M 1445.0 268 L 1445.0 2338" fill="none" stroke="#9ea8b1" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="1327.0" y="195" width="236" height="73" rx="4" fill="#f0f3f5" stroke="#17212b"/><text x="1445.0" y="224" text-anchor="middle" font-size="21" fill="#17212b" font-weight="400">Согласующий / инициатор</text><rect x="169.0" y="288" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="370.0" y="305" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">1. Создать согласование или предложить</text><text x="370.0" y="329" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">интервалы выезда</text><path d="M 155.0 361 L 585.0 361" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="581.0" y="387" width="133.0" height="122" rx="0" fill="white" stroke="none"/><text x="605.0" y="405" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">2. Сохранить запрос: тикет,</text><text x="605.0" y="428" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">адресат, версия, срок ответа,</text><text x="605.0" y="451" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">часовой пояс</text><path d="M 585.0 482 H 710.0 V 507 H 585.0" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="599.0" y="531" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="800.0" y="548" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">3. Отправить запрос и кнопки действий с</text><text x="800.0" y="572" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">ограниченным сроком</text><path d="M 585.0 604 L 1015.0 604" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="1029.0" y="631" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="1230.0" y="648" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">4. Согласовать / отклонить либо выбрать</text><text x="1230.0" y="672" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">дату и время</text><path d="M 1015.0 704 L 1445.0 704" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="1029.0" y="731" width="402.0" height="34" rx="0" fill="white" stroke="none"/><text x="1230.0" y="748" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">5. Нажать кнопку или выбрать интервал</text><path d="M 1445.0 780 L 1015.0 780" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="599.0" y="807" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="800.0" y="824" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">6. Передать событие: пользователь</text><text x="800.0" y="848" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">Telegram, запрос, версия, действие</text><path d="M 1015.0 880 L 585.0 880" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="581.0" y="906" width="133.0" height="122" rx="0" fill="white" stroke="none"/><text x="605.0" y="924" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">7. Проверить привязку</text><text x="605.0" y="947" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">пользователя, полномочия, срок,</text><text x="605.0" y="970" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">версию и повтор</text><path d="M 585.0 1001 H 710.0 V 1026 H 585.0" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="65" y="1067" width="1470" height="39" rx="0" fill="#f0f3f5" stroke="#d4d9de"/><text x="80" y="1093" text-anchor="start" font-size="18" fill="#17212b" font-weight="600">alt</text><text x="155" y="1093" text-anchor="start" font-size="18" fill="#596572" font-weight="400">[проверки успешны; действие допустимо при фиксации]</text><rect x="83" y="1136" width="1434" height="39" rx="0" fill="#f0f3f5" stroke="#d4d9de"/><text x="98" y="1162" text-anchor="start" font-size="18" fill="#17212b" font-weight="600">alt</text><text x="173" y="1162" text-anchor="start" font-size="18" fill="#596572" font-weight="400">[согласование]</text><rect x="581.0" y="1187" width="133.0" height="99" rx="0" fill="white" stroke="none"/><text x="605.0" y="1205" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">8. Сохранить решение и автора;</text><text x="605.0" y="1228" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">при отказе — причину</text><path d="M 585.0 1259 H 710.0 V 1284 H 585.0" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><path d="M 83 1325 L 1517 1325" fill="none" stroke="#d4d9de" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="88" y="1330" width="1424" height="32" rx="0" fill="white" stroke="none"/><text x="173" y="1352" text-anchor="start" font-size="18" fill="#596572" font-weight="400">[выбор даты выезда]</text><rect x="581.0" y="1372" width="133.0" height="99" rx="0" fill="white" stroke="none"/><text x="605.0" y="1390" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">9. Атомарно проверить свободный</text><text x="605.0" y="1413" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">интервал и закрепить дату</text><path d="M 585.0 1444 H 710.0 V 1469 H 585.0" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><path d="M 83 1136 V 1510 H 1517 V 1136" fill="none" stroke="#d4d9de"/><rect x="581.0" y="1518" width="133.0" height="99" rx="0" fill="white" stroke="none"/><text x="605.0" y="1536" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">10. Обновить тикет, аудит и</text><text x="605.0" y="1559" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">событие уведомления</text><path d="M 585.0 1590 H 710.0 V 1615 H 585.0" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="599.0" y="1639" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="800.0" y="1656" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">11. Результат: решение принято / дата</text><text x="800.0" y="1680" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">закреплена</text><path d="M 585.0 1712 L 1015.0 1712" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="1029.0" y="1739" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="1230.0" y="1756" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">12. Обновить сообщение и отключить</text><text x="1230.0" y="1780" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">обработанные кнопки</text><path d="M 1015.0 1812 L 1445.0 1812" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="169.0" y="1839" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="370.0" y="1856" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">13. Показать решение или подтверждённый</text><text x="370.0" y="1880" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">выезд</text><path d="M 585.0 1912 L 155.0 1912" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M 65 1956 L 1535 1956" fill="none" stroke="#d4d9de" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="70" y="1961" width="1460" height="32" rx="0" fill="white" stroke="none"/><text x="155" y="1983" text-anchor="start" font-size="18" fill="#596572" font-weight="400">[нет прав, запрос устарел или интервал уже занят]</text><rect x="599.0" y="2004" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="800.0" y="2021" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">14. Отказ без изменения тикета; при</text><text x="800.0" y="2045" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">конфликте — актуальные интервалы</text><path d="M 585.0 2077 L 1015.0 2077" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="1029.0" y="2104" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="1230.0" y="2121" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">15. Показать причину и доступное</text><text x="1230.0" y="2145" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">следующее действие</text><path d="M 1015.0 2177 L 1445.0 2177" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M 65 1067 V 2221 H 1535 V 1067" fill="none" stroke="#d4d9de"/><rect x="82" y="2247" width="1436" height="65" rx="3" fill="#f5f7f8" stroke="#d4d9de"/><text x="800.0" y="2272" text-anchor="middle" font-size="18" fill="#596572" font-weight="400">Повтор того же ответа возвращает уже сохранённый результат. Нет ответа до срока — напоминание/эскалация, без автоматического</text><text x="800.0" y="2295" text-anchor="middle" font-size="18" fill="#596572" font-weight="400">согласования.</text><rect x="65" y="2350" width="1470" height="100" rx="5" fill="#f6f7f8" stroke="#d4d9de"/><text x="86" y="2380" text-anchor="start" font-size="16" fill="#596572" font-weight="600">ПЕРЕДАВАЕМЫЕ ДАННЫЕ / ПРАВИЛА</text><text x="86" y="2411" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">Согласование выполняет назначенный согласующий; время выбирает инициатор или уполномоченное контактное лицо. СД хранит окончательное</text><text x="86" y="2434" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">решение и дату.</text><path d="M 52 2486 L 1548 2486" fill="none" stroke="#d4d9de" stroke-width="1.8"/><text x="52" y="2519" text-anchor="start" font-size="17" fill="#596572" font-weight="400">UML Sequence · Время — сверху вниз. Сплошная стрелка — сообщение, пунктирная — ответ; alt/opt/loop — условия.</text><text x="52" y="2550" text-anchor="start" font-size="16" fill="#596572" font-weight="400">Целевая модель. Схема не подтверждает готовность интеграции или полноту реализованных прав.</text></g></svg>