<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2039" viewBox="0 0 1600 2039" role="img" aria-label="СД → 1С · Данные закупки по обращению"><title>СД → 1С · Данные закупки по обращению</title><defs><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#17212b" stroke-width="1.3"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1600" height="2039" rx="0" fill="#fff" stroke="none"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#17212b" stroke="none"/><text x="52" y="57" text-anchor="start" font-size="18" fill="#596572" font-weight="400">DEVCONTROL / SERVICE DESK</text><text x="1548" y="57" text-anchor="end" font-size="18" fill="#596572" font-weight="400">TO-BE · 10.09.2026</text><text x="52" y="111" text-anchor="start" font-size="34" fill="#17212b" font-weight="600">СД → 1С · Данные закупки по обращению</text><text x="52" y="150" text-anchor="start" font-size="20" fill="#596572" font-weight="400">Поиск по номеру ERP, указанному в тикете; создание закупки не входит в сценарий.</text><path d="M 155.0 268 L 155.0 1797" fill="none" stroke="#9ea8b1" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="37.0" y="195" width="236" height="73" rx="4" fill="#f0f3f5" stroke="#17212b"/><text x="155.0" y="224" text-anchor="middle" font-size="21" fill="#17212b" font-weight="400">Исполнитель</text><path d="M 585.0 268 L 585.0 1797" fill="none" stroke="#9ea8b1" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="467.0" y="195" width="236" height="73" rx="4" fill="#f0f3f5" stroke="#17212b"/><text x="585.0" y="224" text-anchor="middle" font-size="21" fill="#17212b" font-weight="400">Service Desk</text><path d="M 1015.0 268 L 1015.0 1797" fill="none" stroke="#9ea8b1" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="897.0" y="195" width="236" height="73" rx="4" fill="#f0f3f5" stroke="#17212b"/><text x="1015.0" y="224" text-anchor="middle" font-size="21" fill="#17212b" font-weight="400">Адаптер 1С</text><path d="M 1445.0 268 L 1445.0 1797" fill="none" stroke="#9ea8b1" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="1327.0" y="195" width="236" height="73" rx="4" fill="#f0f3f5" stroke="#17212b"/><text x="1445.0" y="224" text-anchor="middle" font-size="21" fill="#17212b" font-weight="400">1С: ERP</text><rect x="169.0" y="288" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="370.0" y="305" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">1. Открыть тикет и запросить данные</text><text x="370.0" y="329" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">закупки</text><path d="M 155.0 361 L 585.0 361" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="581.0" y="387" width="133.0" height="99" rx="0" fill="white" stroke="none"/><text x="605.0" y="405" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">2. Проверить доступ к тикету и</text><text x="605.0" y="428" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">наличие номера ERP</text><path d="M 585.0 459 H 710.0 V 484 H 585.0" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="65" y="525" width="1470" height="39" rx="0" fill="#f0f3f5" stroke="#d4d9de"/><text x="80" y="551" text-anchor="start" font-size="18" fill="#17212b" font-weight="600">loop</text><text x="155" y="551" text-anchor="start" font-size="18" fill="#596572" font-weight="400">[для каждого номера ERP в обращении]</text><rect x="599.0" y="577" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="800.0" y="594" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">3. Найти закупку: номер ERP + организация</text><text x="800.0" y="618" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">+ идентификатор запроса</text><path d="M 585.0 650 L 1015.0 650" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="1029.0" y="677" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="1230.0" y="694" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">4. Запросить данные закупки от имени</text><text x="1230.0" y="718" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">интеграции</text><path d="M 1015.0 750 L 1445.0 750" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="83" y="794" width="1434" height="39" rx="0" fill="#f0f3f5" stroke="#d4d9de"/><text x="98" y="820" text-anchor="start" font-size="18" fill="#17212b" font-weight="600">alt</text><text x="173" y="820" text-anchor="start" font-size="18" fill="#596572" font-weight="400">[найдена одна закупка в разрешённой организации]</text><rect x="1029.0" y="846" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="1230.0" y="863" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">5. ID, номер, статус, позиции,</text><text x="1230.0" y="887" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">количество, даты и ответственный</text><path d="M 1445.0 919 L 1015.0 919" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="599.0" y="946" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="800.0" y="963" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">6. Нормализованные данные и время</text><text x="800.0" y="987" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">получения</text><path d="M 1015.0 1019 L 585.0 1019" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="169.0" y="1046" width="402.0" height="34" rx="0" fill="white" stroke="none"/><text x="370.0" y="1063" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">7. Показать данные в карточке тикета</text><path d="M 585.0 1095 L 155.0 1095" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M 83 1139 L 1517 1139" fill="none" stroke="#d4d9de" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="88" y="1144" width="1424" height="32" rx="0" fill="white" stroke="none"/><text x="173" y="1166" text-anchor="start" font-size="18" fill="#596572" font-weight="400">[нет результата или найдено несколько закупок]</text><rect x="1029.0" y="1187" width="402.0" height="34" rx="0" fill="white" stroke="none"/><text x="1230.0" y="1204" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">8. Не найдено / требуется уточнение</text><path d="M 1445.0 1236 L 1015.0 1236" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="599.0" y="1263" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="800.0" y="1280" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">9. Результат поиска без автоматического</text><text x="800.0" y="1304" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">выбора</text><path d="M 1015.0 1336 L 585.0 1336" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="169.0" y="1363" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="370.0" y="1380" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">10. Предложить уточнить номер,</text><text x="370.0" y="1404" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">организацию или год</text><path d="M 585.0 1436 L 155.0 1436" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M 83 1480 L 1517 1480" fill="none" stroke="#d4d9de" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="88" y="1485" width="1424" height="32" rx="0" fill="white" stroke="none"/><text x="173" y="1507" text-anchor="start" font-size="18" fill="#596572" font-weight="400">[1С недоступна или превышено время ожидания]</text><rect x="599.0" y="1528" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="800.0" y="1545" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">11. Ошибка обмена; ограниченный повтор</text><text x="800.0" y="1569" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">запроса</text><path d="M 1015.0 1601 L 585.0 1601" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="169.0" y="1628" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="370.0" y="1645" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">12. Показать ошибку; прежние данные</text><text x="370.0" y="1669" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">пометить временем получения</text><path d="M 585.0 1701 L 155.0 1701" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M 83 794 V 1745 H 1517 V 794" fill="none" stroke="#d4d9de"/><path d="M 65 525 V 1771 H 1535 V 525" fill="none" stroke="#d4d9de"/><rect x="65" y="1809" width="1470" height="100" rx="5" fill="#f6f7f8" stroke="#d4d9de"/><text x="86" y="1839" text-anchor="start" font-size="16" fill="#596572" font-weight="600">ПЕРЕДАВАЕМЫЕ ДАННЫЕ / ПРАВИЛА</text><text x="86" y="1870" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">Ключ поиска: номер ERP + организация; при неоднозначности — год или ID. 1С — источник закупочных данных. Пароли в тикет не</text><text x="86" y="1893" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">передаются.</text><path d="M 52 1945 L 1548 1945" fill="none" stroke="#d4d9de" stroke-width="1.8"/><text x="52" y="1978" text-anchor="start" font-size="17" fill="#596572" font-weight="400">UML Sequence · Время — сверху вниз. Сплошная стрелка — сообщение, пунктирная — ответ; alt/opt/loop — условия.</text><text x="52" y="2009" text-anchor="start" font-size="16" fill="#596572" font-weight="400">Целевая модель. Схема не подтверждает готовность интеграции или полноту реализованных прав.</text></g></svg>