<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1954" viewBox="0 0 1600 1954" role="img" aria-label="СД → Telegram · Уведомление о проблеме"><title>СД → Telegram · Уведомление о проблеме</title><defs><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#17212b" stroke-width="1.3"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1600" height="1954" rx="0" fill="#fff" stroke="none"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#17212b" stroke="none"/><text x="52" y="57" text-anchor="start" font-size="18" fill="#596572" font-weight="400">DEVCONTROL / SERVICE DESK</text><text x="1548" y="57" text-anchor="end" font-size="18" fill="#596572" font-weight="400">TO-BE · 10.09.2026</text><text x="52" y="111" text-anchor="start" font-size="34" fill="#17212b" font-weight="600">СД → Telegram · Уведомление о проблеме</text><text x="52" y="150" text-anchor="start" font-size="20" fill="#596572" font-weight="400">Событие обращения приводит к уведомлению разрешённого получателя.</text><path d="M 155.0 268 L 155.0 1712" fill="none" stroke="#9ea8b1" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="37.0" y="195" width="236" height="73" rx="4" fill="#f0f3f5" stroke="#17212b"/><text x="155.0" y="224" text-anchor="middle" font-size="21" fill="#17212b" font-weight="400">Service Desk</text><path d="M 585.0 268 L 585.0 1712" fill="none" stroke="#9ea8b1" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="467.0" y="195" width="236" height="73" rx="4" fill="#f0f3f5" stroke="#17212b"/><text x="585.0" y="224" text-anchor="middle" font-size="21" fill="#17212b" font-weight="400">Сервис уведомлений</text><path d="M 1015.0 268 L 1015.0 1712" fill="none" stroke="#9ea8b1" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="897.0" y="195" width="236" height="73" rx="4" fill="#f0f3f5" stroke="#17212b"/><text x="1015.0" y="224" text-anchor="middle" font-size="21" fill="#17212b" font-weight="400">Telegram Bot API</text><path d="M 1445.0 268 L 1445.0 1712" fill="none" stroke="#9ea8b1" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="1327.0" y="195" width="236" height="73" rx="4" fill="#f0f3f5" stroke="#17212b"/><text x="1445.0" y="224" text-anchor="middle" font-size="21" fill="#17212b" font-weight="400">Получатель</text><rect x="151.0" y="287" width="133.0" height="99" rx="0" fill="white" stroke="none"/><text x="175.0" y="305" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">1. Сохранить обращение и событие</text><text x="175.0" y="328" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">уведомления в одной транзакции</text><path d="M 155.0 359 H 280.0 V 384 H 155.0" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="169.0" y="408" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="370.0" y="425" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">2. Событие: новая проблема, назначение,</text><text x="370.0" y="449" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">изменение статуса или SLA</text><path d="M 155.0 481 L 585.0 481" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="581.0" y="507" width="133.0" height="122" rx="0" fill="white" stroke="none"/><text x="605.0" y="525" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">3. Определить получателей,</text><text x="605.0" y="548" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">проверить права и привязку</text><text x="605.0" y="571" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">Telegram</text><path d="M 585.0 602 H 710.0 V 627 H 585.0" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="65" y="668" width="1470" height="39" rx="0" fill="#f0f3f5" stroke="#d4d9de"/><text x="80" y="694" text-anchor="start" font-size="18" fill="#17212b" font-weight="600">alt</text><text x="155" y="694" text-anchor="start" font-size="18" fill="#596572" font-weight="400">[чат привязан и уведомление разрешено]</text><rect x="599.0" y="720" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="800.0" y="737" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">4. Отправить краткое сообщение: номер,</text><text x="800.0" y="761" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">тема, приоритет, статус, ссылка</text><path d="M 585.0 793 L 1015.0 793" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="1029.0" y="820" width="402.0" height="34" rx="0" fill="white" stroke="none"/><text x="1230.0" y="837" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">5. Показать уведомление о заявке</text><path d="M 1015.0 869 L 1445.0 869" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="599.0" y="896" width="402.0" height="34" rx="0" fill="white" stroke="none"/><text x="800.0" y="913" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">6. Подтверждение отправки и message_id</text><path d="M 1015.0 945 L 585.0 945" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="169.0" y="972" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="370.0" y="989" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">7. Зафиксировать отправку; это не</text><text x="370.0" y="1013" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">подтверждение прочтения</text><path d="M 585.0 1045 L 155.0 1045" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M 65 1089 L 1535 1089" fill="none" stroke="#d4d9de" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="70" y="1094" width="1460" height="32" rx="0" fill="white" stroke="none"/><text x="155" y="1116" text-anchor="start" font-size="18" fill="#596572" font-weight="400">[нет привязки или бот заблокирован]</text><rect x="169.0" y="1137" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="370.0" y="1154" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">8. Зафиксировать причину; применить</text><text x="370.0" y="1178" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">разрешённый резервный канал</text><path d="M 585.0 1210 L 155.0 1210" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M 65 1254 L 1535 1254" fill="none" stroke="#d4d9de" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="70" y="1259" width="1460" height="32" rx="0" fill="white" stroke="none"/><text x="155" y="1281" text-anchor="start" font-size="18" fill="#596572" font-weight="400">[временная ошибка или ограничение Telegram]</text><rect x="581.0" y="1301" width="133.0" height="99" rx="0" fill="white" stroke="none"/><text x="605.0" y="1319" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">9. Повторить с задержкой; после</text><text x="605.0" y="1342" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">лимита — ошибка для оператора</text><path d="M 585.0 1373 H 710.0 V 1398 H 585.0" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><path d="M 65 668 V 1439 H 1535 V 668" fill="none" stroke="#d4d9de"/><rect x="65" y="1465" width="1470" height="39" rx="0" fill="#f0f3f5" stroke="#d4d9de"/><text x="80" y="1491" text-anchor="start" font-size="18" fill="#17212b" font-weight="600">opt</text><text x="155" y="1491" text-anchor="start" font-size="18" fill="#596572" font-weight="400">[получатель открывает ссылку]</text><rect x="169.0" y="1517" width="1262.0" height="34" rx="0" fill="white" stroke="none"/><text x="800.0" y="1534" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">10. Открыть тикет в СД через действующую сессию</text><path d="M 1445.0 1566 L 155.0 1566" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="169.0" y="1593" width="1262.0" height="34" rx="0" fill="white" stroke="none"/><text x="800.0" y="1610" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">11. Показать карточку после проверки прав</text><path d="M 155.0 1642 L 1445.0 1642" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M 65 1465 V 1686 H 1535 V 1465" fill="none" stroke="#d4d9de"/><rect x="65" y="1724" width="1470" height="100" rx="5" fill="#f6f7f8" stroke="#d4d9de"/><text x="86" y="1754" text-anchor="start" font-size="16" fill="#596572" font-weight="600">ПЕРЕДАВАЕМЫЕ ДАННЫЕ / ПРАВИЛА</text><text x="86" y="1785" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">СД — источник статуса. В Telegram — минимум сведений и защищённая ссылка. События дедуплицируются; при неопределённом ответе</text><text x="86" y="1808" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">возможна повторная доставка.</text><path d="M 52 1860 L 1548 1860" fill="none" stroke="#d4d9de" stroke-width="1.8"/><text x="52" y="1893" text-anchor="start" font-size="17" fill="#596572" font-weight="400">UML Sequence · Время — сверху вниз. Сплошная стрелка — сообщение, пунктирная — ответ; alt/opt/loop — условия.</text><text x="52" y="1924" text-anchor="start" font-size="16" fill="#596572" font-weight="400">Целевая модель. Схема не подтверждает готовность интеграции или полноту реализованных прав.</text></g></svg>