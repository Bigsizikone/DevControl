<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2381" viewBox="0 0 1600 2381" role="img" aria-label="1С → СД · Служебная записка на доступ"><title>1С → СД · Служебная записка на доступ</title><defs><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#17212b" stroke-width="1.3"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1600" height="2381" rx="0" fill="#fff" stroke="none"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#17212b" stroke="none"/><text x="52" y="57" text-anchor="start" font-size="18" fill="#596572" font-weight="400">DEVCONTROL / SERVICE DESK</text><text x="1548" y="57" text-anchor="end" font-size="18" fill="#596572" font-weight="400">TO-BE · 10.09.2026</text><text x="52" y="111" text-anchor="start" font-size="34" fill="#17212b" font-weight="600">1С → СД · Служебная записка на доступ</text><text x="52" y="150" text-anchor="start" font-size="20" fill="#596572" font-weight="400">Служебная записка создаёт запрос прав доступа; получение документа не означает выдачу прав.</text><path d="M 155.0 268 L 155.0 2139" fill="none" stroke="#9ea8b1" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="37.0" y="195" width="236" height="73" rx="4" fill="#f0f3f5" stroke="#17212b"/><text x="155.0" y="224" text-anchor="middle" font-size="21" fill="#17212b" font-weight="400">1С / служебная записка</text><path d="M 585.0 268 L 585.0 2139" fill="none" stroke="#9ea8b1" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="467.0" y="195" width="236" height="73" rx="4" fill="#f0f3f5" stroke="#17212b"/><text x="585.0" y="224" text-anchor="middle" font-size="21" fill="#17212b" font-weight="400">Service Desk</text><path d="M 1015.0 268 L 1015.0 2139" fill="none" stroke="#9ea8b1" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="897.0" y="195" width="236" height="73" rx="4" fill="#f0f3f5" stroke="#17212b"/><text x="1015.0" y="224" text-anchor="middle" font-size="21" fill="#17212b" font-weight="400">Согласующий / ИБ</text><path d="M 1445.0 268 L 1445.0 2139" fill="none" stroke="#9ea8b1" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="1327.0" y="195" width="236" height="73" rx="4" fill="#f0f3f5" stroke="#17212b"/><text x="1445.0" y="224" text-anchor="middle" font-size="21" fill="#17212b" font-weight="400">Исполнитель доступа</text><rect x="169.0" y="288" width="402.0" height="82" rx="0" fill="white" stroke="none"/><text x="370.0" y="305" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">1. Передать записку: ID, версия,</text><text x="370.0" y="329" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">сотрудник, система, права, основание,</text><text x="370.0" y="353" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">срок</text><path d="M 155.0 385 L 585.0 385" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="581.0" y="411" width="133.0" height="122" rx="0" fill="white" stroke="none"/><text x="605.0" y="429" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">2. Проверить источник,</text><text x="605.0" y="452" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">обязательные поля и соответствие</text><text x="605.0" y="475" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">справочникам</text><path d="M 585.0 506 H 710.0 V 531 H 585.0" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="65" y="572" width="1470" height="39" rx="0" fill="#f0f3f5" stroke="#d4d9de"/><text x="80" y="598" text-anchor="start" font-size="18" fill="#17212b" font-weight="600">alt</text><text x="155" y="598" text-anchor="start" font-size="18" fill="#596572" font-weight="400">[новая или допустимая обновлённая версия]</text><rect x="581.0" y="623" width="133.0" height="122" rx="0" fill="white" stroke="none"/><text x="605.0" y="641" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">3. Создать / обновить связанный</text><text x="605.0" y="664" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">запрос доступа и сохранить</text><text x="605.0" y="687" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">исходный ID</text><path d="M 585.0 718 H 710.0 V 743 H 585.0" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="169.0" y="767" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="370.0" y="784" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">4. Вернуть ID обращения, номер и статус</text><text x="370.0" y="808" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">принятия</text><path d="M 585.0 840 L 155.0 840" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="599.0" y="867" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="800.0" y="884" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">5. Направить на требуемые согласования;</text><text x="800.0" y="908" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">учесть подтверждения из 1С</text><path d="M 585.0 940 L 1015.0 940" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="599.0" y="967" width="402.0" height="34" rx="0" fill="white" stroke="none"/><text x="800.0" y="984" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">6. Решение, автор, дата, комментарий</text><path d="M 1015.0 1016 L 585.0 1016" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="83" y="1060" width="1434" height="39" rx="0" fill="#f0f3f5" stroke="#d4d9de"/><text x="98" y="1086" text-anchor="start" font-size="18" fill="#17212b" font-weight="600">alt</text><text x="173" y="1086" text-anchor="start" font-size="18" fill="#596572" font-weight="400">[все обязательные согласования получены]</text><rect x="599.0" y="1112" width="832.0" height="34" rx="0" fill="white" stroke="none"/><text x="1015.0" y="1129" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">7. Назначить исполнение: система, сотрудник, точный набор прав и срок</text><path d="M 585.0 1161 L 1445.0 1161" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="1316.0" y="1187" width="133.0" height="99" rx="0" fill="white" stroke="none"/><text x="1425.0" y="1205" text-anchor="end" font-size="18" fill="#17212b" font-weight="400">8. Предоставить права в целевой</text><text x="1425.0" y="1228" text-anchor="end" font-size="18" fill="#17212b" font-weight="400">системе; проверить результат</text><path d="M 1445.0 1259 H 1320.0 V 1284 H 1445.0" fill="none" stroke="#17212b" stroke-width="1.8" marker-end="url(#open)"/><rect x="599.0" y="1308" width="832.0" height="34" rx="0" fill="white" stroke="none"/><text x="1015.0" y="1325" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">9. Зафиксировать фактические права, время, исполнителя и результат</text><path d="M 1445.0 1357 L 585.0 1357" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><rect x="169.0" y="1384" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="370.0" y="1401" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">10. Передать итог: выполнено / ошибка</text><text x="370.0" y="1425" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">исполнения и номер обращения</text><path d="M 585.0 1457 L 155.0 1457" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M 83 1501 L 1517 1501" fill="none" stroke="#d4d9de" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="88" y="1506" width="1424" height="32" rx="0" fill="white" stroke="none"/><text x="173" y="1528" text-anchor="start" font-size="18" fill="#596572" font-weight="400">[отказ или возврат на уточнение]</text><rect x="169.0" y="1549" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="370.0" y="1566" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">11. Передать статус, причину и</text><text x="370.0" y="1590" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">необходимые уточнения</text><path d="M 585.0 1622 L 155.0 1622" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M 83 1060 V 1666 H 1517 V 1060" fill="none" stroke="#d4d9de"/><path d="M 65 1692 L 1535 1692" fill="none" stroke="#d4d9de" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="70" y="1697" width="1460" height="32" rx="0" fill="white" stroke="none"/><text x="155" y="1719" text-anchor="start" font-size="18" fill="#596572" font-weight="400">[повтор уже принятой версии]</text><rect x="169.0" y="1740" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="370.0" y="1757" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">12. Вернуть существующее обращение без</text><text x="370.0" y="1781" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">дубликата</text><path d="M 585.0 1813 L 155.0 1813" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M 65 1857 L 1535 1857" fill="none" stroke="#d4d9de" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="70" y="1862" width="1460" height="32" rx="0" fill="white" stroke="none"/><text x="155" y="1884" text-anchor="start" font-size="18" fill="#596572" font-weight="400">[неверные данные или неизвестный сотрудник / система]</text><rect x="169.0" y="1905" width="402.0" height="58" rx="0" fill="white" stroke="none"/><text x="370.0" y="1922" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">13. Вернуть ошибки полей; не создавать</text><text x="370.0" y="1946" text-anchor="middle" font-size="18" fill="#17212b" font-weight="400">исполнимое задание</text><path d="M 585.0 1978 L 155.0 1978" fill="none" stroke="#17212b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#open)"/><path d="M 65 572 V 2022 H 1535 V 572" fill="none" stroke="#d4d9de"/><rect x="82" y="2048" width="1436" height="65" rx="3" fill="#f5f7f8" stroke="#d4d9de"/><text x="800.0" y="2073" text-anchor="middle" font-size="18" fill="#596572" font-weight="400">Недоступность СД: 1С сохраняет сообщение и повторяет доставку. Временный доступ требует задачи на отзыв и подтверждения</text><text x="800.0" y="2096" text-anchor="middle" font-size="18" fill="#596572" font-weight="400">фактического отзыва.</text><rect x="65" y="2151" width="1470" height="100" rx="5" fill="#f6f7f8" stroke="#d4d9de"/><text x="86" y="2181" text-anchor="start" font-size="16" fill="#596572" font-weight="600">ПЕРЕДАВАЕМЫЕ ДАННЫЕ / ПРАВИЛА</text><text x="86" y="2212" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">Ключ идемпотентности: источник + ID записки + версия. Правила согласования и способ выдачи прав определяются отдельно для каждой</text><text x="86" y="2235" text-anchor="start" font-size="18" fill="#17212b" font-weight="400">целевой системы.</text><path d="M 52 2287 L 1548 2287" fill="none" stroke="#d4d9de" stroke-width="1.8"/><text x="52" y="2320" text-anchor="start" font-size="17" fill="#596572" font-weight="400">UML Sequence · Время — сверху вниз. Сплошная стрелка — сообщение, пунктирная — ответ; alt/opt/loop — условия.</text><text x="52" y="2351" text-anchor="start" font-size="16" fill="#596572" font-weight="400">Целевая модель. Схема не подтверждает готовность интеграции или полноту реализованных прав.</text></g></svg>